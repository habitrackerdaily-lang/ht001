<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncHabit - Tracker Dashboard</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    

    <style>
        html, body {
          margin: 0;
          padding: 0;
        }
        #root {
          min-height: 100vh;
        }
        img {
          max-width: 100%;
          height: auto;
        }
        
        body { font-family: 'Inter', sans-serif; }
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #334155; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-200">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- ICONS (Replacing lucide-react for standalone HTML) ---
        const Activity = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>;
        const Calendar = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>;
        const BarChart2 = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>;
        const SettingsIcon = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>;
        const Bell = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>;
        const Trash2 = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>;
        const Edit2 = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>;
        const Moon = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>;
        const Sun = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>;
        const CheckCircle2 = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9 12l2 2 4-4"></path></svg>;
        const Flame = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path></svg>;
        const Target = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg>;
        const Trophy = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"></path><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"></path><path d="M18 2H6v7a6 6 0 0 0 12 0V2z"></path></svg>;
        const Info = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>;
        const Plus = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
        const Check = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>;
        const X = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>;

        // --- MOCK GOOGLE SHEETS DATABASE ---
        const MOCK_DB_KEY = 'sheets_habit_db';
        const API_URL_KEY = 'sheets_api_url';

        const getApiUrl = () => localStorage.getItem(API_URL_KEY) || '';

        const initialDB = {
          Users: [{ user_id: 'u1', name: 'Demo User', email: 'demo@example.com', created_at: new Date().toISOString() }],
          Habits: [
            { habit_id: 'h1', user_id: 'u1', habit_name: 'Drink Water', category: 'Health', habit_type: 'count', target_value: 8, schedule_type: 'daily', created_at: '2023-10-01', active: true },
            { habit_id: 'h2', user_id: 'u1', habit_name: 'Read Book', category: 'Learning', habit_type: 'duration', target_value: 30, schedule_type: 'daily', created_at: '2023-10-01', active: true },
            { habit_id: 'h3', user_id: 'u1', habit_name: 'Morning Workout', category: 'Fitness', habit_type: 'boolean', target_value: 1, schedule_type: 'daily', created_at: '2023-10-01', active: true }
          ],
          Habit_Log: [],
          Habit_Stats: [
            { habit_id: 'h1', current_streak: 3, longest_streak: 12, completion_rate: 85 },
            { habit_id: 'h2', current_streak: 5, longest_streak: 20, completion_rate: 92 },
            { habit_id: 'h3', current_streak: 0, longest_streak: 5, completion_rate: 45 }
          ]
        };

        // Seed some past logs for demonstration
        const todayDate = new Date();
        for(let i=14; i>=0; i--) {
          const d = new Date(todayDate); d.setDate(d.getDate() - i);
          const dateStr = d.toISOString().split('T')[0];
          if (Math.random() > 0.2) initialDB.Habit_Log.push({ log_id: `l1_${i}`, habit_id: 'h1', user_id: 'u1', date: dateStr, value: 8, status: 'done', notes: '' });
          if (Math.random() > 0.3) initialDB.Habit_Log.push({ log_id: `l2_${i}`, habit_id: 'h2', user_id: 'u1', date: dateStr, value: 30, status: 'done', notes: '' });
          if (Math.random() > 0.6) initialDB.Habit_Log.push({ log_id: `l3_${i}`, habit_id: 'h3', user_id: 'u1', date: dateStr, value: 1, status: 'done', notes: '' });
        }

        const SheetsAPI = {
          getDB: () => JSON.parse(localStorage.getItem(MOCK_DB_KEY)) || initialDB,
          saveDB: (db) => localStorage.setItem(MOCK_DB_KEY, JSON.stringify(db)),
          
          _fetchTable: async (tableName) => {
            const url = getApiUrl();
            if (url) {
              try {
                const res = await fetch(`${url}?table=${tableName}`);
                if (!res.ok) throw new Error('Network error');
                return await res.json();
              } catch (e) {
                console.error(`Gagal mengambil data ${tableName} dari GSheets:`, e);
              }
            }
            return null; 
          },

          _postAction: async (tableName, action, data) => {
            const url = getApiUrl();
            if (url) {
              try {
                const res = await fetch(url, {
                  method: 'POST',
                  headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                  body: JSON.stringify({ table: tableName, action, data })
                });
                return await res.json();
              } catch (e) {
                console.error(`Gagal menyimpan data ke ${tableName}:`, e);
              }
            }
            return null;
          },
          
          getHabits: async () => {
            const remote = await SheetsAPI._fetchTable('Habits');
            if (remote) return remote.filter(h => h.active === true || h.active === "TRUE" || h.active === "true");
            return SheetsAPI.getDB().Habits.filter(h => h.active);
          },
          
          getLogs: async () => {
            const remote = await SheetsAPI._fetchTable('Habit_Log');
            if (remote) return remote;
            return SheetsAPI.getDB().Habit_Log;
          },
          
          getStats: async () => {
            const remote = await SheetsAPI._fetchTable('Habit_Stats');
            if (remote) return remote;
            return SheetsAPI.getDB().Habit_Stats;
          },
          
          createHabit: async (habit) => {
            const newHabit = { ...habit, habit_id: `h_${Date.now()}`, user_id: 'u1', created_at: new Date().toISOString(), active: true };
            const newStat = { habit_id: newHabit.habit_id, current_streak: 0, longest_streak: 0, completion_rate: 0 };
            
            const db = SheetsAPI.getDB();
            db.Habits.push(newHabit);
            db.Habit_Stats.push(newStat);
            SheetsAPI.saveDB(db);

            await SheetsAPI._postAction('Habits', 'insert', newHabit);
            await SheetsAPI._postAction('Habit_Stats', 'insert', newStat);
            return newHabit;
          },
          
          updateHabit: async (habit_id, updates) => {
            const db = SheetsAPI.getDB();
            const existing = db.Habits.find(h => h.habit_id === habit_id) || {};
            const merged = { ...existing, ...updates };
            
            db.Habits = db.Habits.map(h => h.habit_id === habit_id ? merged : h);
            SheetsAPI.saveDB(db);

            await SheetsAPI._postAction('Habits', 'update', { habit_id, ...updates });
          },
          
          deleteHabit: async (habit_id) => {
            const db = SheetsAPI.getDB();
            db.Habits = db.Habits.map(h => h.habit_id === habit_id ? { ...h, active: false } : h);
            SheetsAPI.saveDB(db);

            await SheetsAPI._postAction('Habits', 'update', { habit_id, active: false });
          },
          
          logHabit: async (habit_id, date, value, status) => {
            const db = SheetsAPI.getDB();
            const existingIdx = db.Habit_Log.findIndex(l => l.habit_id === habit_id && l.date === date);
            
            const logData = { habit_id, user_id: 'u1', date, value, status, notes: '' };
            let log_id;

            if (existingIdx >= 0) {
              log_id = db.Habit_Log[existingIdx].log_id;
              logData.log_id = log_id;
              db.Habit_Log[existingIdx] = { ...db.Habit_Log[existingIdx], ...logData };
              await SheetsAPI._postAction('Habit_Log', 'update', logData);
            } else {
              log_id = `log_${Date.now()}`;
              logData.log_id = log_id;
              db.Habit_Log.push(logData);
              await SheetsAPI._postAction('Habit_Log', 'insert', logData);
            }

            // Update Local Stats
            let stats = db.Habit_Stats.find(s => s.habit_id === habit_id);
            if(stats && status === 'done') {
                stats.current_streak += 1;
                if(stats.current_streak > stats.longest_streak) stats.longest_streak = stats.current_streak;
                await SheetsAPI._postAction('Habit_Stats', 'update', stats);
            } else if (stats && status !== 'done' && status !== 'partial') {
                stats.current_streak = 0;
                await SheetsAPI._postAction('Habit_Stats', 'update', stats);
            }

            SheetsAPI.saveDB(db);
            return true;
          }
        };

        const getTodayStr = () => new Date().toISOString().split('T')[0];
        const classNames = (...classes) => classes.filter(Boolean).join(' ');

        // --- COMPONENTS ---

        const Toast = ({ message, type = 'info', onClose }) => {
          useEffect(() => {
            const timer = setTimeout(onClose, 3000);
            return () => clearTimeout(timer);
          }, [onClose]);

          return (
            <div className={`fixed bottom-4 right-4 z-50 flex items-center p-4 mb-4 text-sm rounded-lg shadow-lg transform transition-all duration-300 translate-y-0 opacity-100 ${
              type === 'success' ? 'text-green-800 bg-green-100 dark:bg-green-900/30 dark:text-green-400' :
              type === 'warning' ? 'text-amber-800 bg-amber-100 dark:bg-amber-900/30 dark:text-amber-400' :
              'text-blue-800 bg-blue-100 dark:bg-blue-900/30 dark:text-blue-400'
            }`}>
              <Bell className="w-4 h-4 mr-2" />
              <span className="font-medium">{message}</span>
            </div>
          );
        };

        function App() {
          const [darkMode, setDarkMode] = useState(false);
          const [currentView, setCurrentView] = useState('dashboard');
          const [userGender, setUserGender] = useState('man'); 
          
          const [habits, setHabits] = useState([]);
          const [logs, setLogs] = useState([]);
          const [stats, setStats] = useState([]);
          const [loading, setLoading] = useState(true);
          const [toast, setToast] = useState(null);

          const fetchData = async () => {
            setLoading(true);
            const h = await SheetsAPI.getHabits();
            const l = await SheetsAPI.getLogs();
            const s = await SheetsAPI.getStats();
            setHabits(h || []);
            setLogs(l || []);
            setStats(s || []);
            setLoading(false);
          };

          useEffect(() => {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
              setDarkMode(true);
            }
            fetchData();
          }, []);

          useEffect(() => {
            if (darkMode) document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
          }, [darkMode]);

          useEffect(() => {
            if (loading) return;
            const today = getTodayStr();
            const pendingHabits = habits.filter(h => {
              const todayLog = logs.find(l => l.habit_id === h.habit_id && l.date === today);
              return !todayLog || todayLog.status !== 'done';
            });
            
            if (pendingHabits.length > 0) {
              const hour = new Date().getHours();
              if (hour >= 18) {
                showToast(`Don't forget! You have ${pendingHabits.length} habits left to complete today.`, 'warning');
                
                if ('Notification' in window && Notification.permission === 'granted') {
                  new Notification('SyncHabit Reminder', {
                    body: `You have ${pendingHabits.length} habits left to complete today!`,
                    icon: 'https://cdn-icons-png.flaticon.com/512/1000/1000243.png'
                  });
                }
              }
            }
          }, [habits, logs, loading]);

          const showToast = (message, type = 'info') => setToast({ message, type });

          const handleLogHabit = async (habit, value, status) => {
            await SheetsAPI.logHabit(habit.habit_id, getTodayStr(), value, status);
            fetchData();
            if (status === 'done') showToast(`Completed: ${habit.habit_name}! 🎉`, 'success');
          };

          const navItems = [
            { id: 'dashboard', icon: Activity, label: 'Dashboard' },
            { id: 'habits', icon: Target, label: 'Habits' },
            { id: 'analytics', icon: BarChart2, label: 'Analytics' },
            { id: 'history', icon: Calendar, label: 'History' },
            { id: 'settings', icon: SettingsIcon, label: 'Settings' },
          ];

          return (
            <div className={`min-h-screen font-sans flex flex-col md:flex-row`}>
              
              <nav className="fixed bottom-0 w-full z-40 bg-white border-t border-slate-200 md:relative md:w-64 md:border-t-0 md:border-r md:h-screen md:bg-white/80 md:backdrop-blur-xl dark:bg-slate-900 dark:border-slate-800 transition-colors flex-shrink-0">
                <div className="hidden md:flex items-center gap-2 p-6 mb-4">
                  <div className="bg-blue-600 p-2 rounded-xl">
                    <CheckCircle2 className="w-6 h-6 text-white" />
                  </div>
                  <span className="font-bold text-xl tracking-tight">SyncHabit</span>
                </div>
                
                <div className="flex md:flex-col justify-around md:justify-start px-2 py-3 md:p-4 gap-1 md:gap-2">
                  {navItems.map(item => {
                    const IconComp = item.icon;
                    const isActive = currentView === item.id;
                    return (
                      <button
                        key={item.id}
                        onClick={() => setCurrentView(item.id)}
                        className={classNames(
                          "flex flex-col md:flex-row items-center md:justify-start flex-1 md:flex-none p-2 md:px-4 md:py-3 rounded-xl transition-all duration-200 group",
                          isActive 
                            ? "bg-blue-50 text-blue-600 dark:bg-blue-900/30 dark:text-blue-400 font-medium shadow-sm" 
                            : "text-slate-500 hover:bg-slate-100 hover:text-slate-900 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-slate-100"
                        )}
                      >
                        <IconComp className={classNames("w-5 h-5 md:mr-3 mb-1 md:mb-0 transition-transform group-hover:scale-110", isActive && "scale-110")} />
                        <span className="text-[10px] md:text-sm">{item.label}</span>
                      </button>
                    )
                  })}
                </div>
              </nav>

              <main className="flex-1 flex flex-col h-screen overflow-hidden">
                <header className="flex items-center justify-between p-4 md:px-8 md:py-6 bg-white/80 backdrop-blur-md border-b border-slate-200 dark:bg-slate-950/80 dark:border-slate-800 sticky top-0 z-30">
                  <div>
                    <h1 className="text-xl md:text-2xl font-bold capitalize">{currentView}</h1>
                    <p className="text-sm text-slate-500 dark:text-slate-400">
                      {new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' })}
                    </p>
                  </div>
                  <div className="flex items-center gap-3">
                    <button 
                      onClick={() => showToast('Notifications are up to date.', 'info')}
                      className="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500 transition-colors relative"
                    >
                      <Bell className="w-5 h-5" />
                      <span className="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
                    </button>
                    <button 
                      onClick={() => setDarkMode(!darkMode)}
                      className="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500 transition-colors"
                    >
                      {darkMode ? <Sun className="w-5 h-5" /> : <Moon className="w-5 h-5" />}
                    </button>
                    <img 
                      src={userGender === 'woman' ? "https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=150&q=80" : "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80"} 
                      alt="User Avatar" 
                      className="w-8 h-8 rounded-full border-2 border-white dark:border-slate-800 shadow-sm ml-2 object-cover" 
                    />
                  </div>
                </header>

                <div className="flex-1 overflow-y-auto p-4 md:p-8 pb-24 md:pb-8">
                  <div className="max-w-6xl mx-auto">
                    {loading ? (
                      <div className="flex items-center justify-center h-64">

                <div className="flex justify-end items-center gap-2 mt-4 text-xs text-slate-500">
                  <span>Less</span>
                  <div className="w-3 h-3 rounded-sm bg-slate-100 dark:bg-slate-800"></div>
                  <div className="w-3 h-3 rounded-sm bg-emerald-300 dark:bg-emerald-700/60"></div>
                  <div className="w-3 h-3 rounded-sm bg-emerald-600 dark:bg-emerald-400"></div>
                  <span>More</span>
                </div>
              </div>
            </div>
          );
        }

        function HistoryView({ logs, habits }) {
          const sortedLogs = useMemo(() => {
            return [...logs].sort((a, b) => new Date(b.date) - new Date(a.date));
          }, [logs]);

          return (
            <div className="animate-fade-in bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden shadow-sm">
              <div className="p-6 border-b border-slate-200 dark:border-slate-800">
                <h2 className="text-xl font-bold">Activity History</h2>
                <p className="text-sm text-slate-500 mt-1">Raw database logs reading from Google Sheets.</p>
              </div>
              <div className="overflow-x-auto max-h-[60vh]">
                <table className="w-full text-left text-sm text-slate-600 dark:text-slate-400">
                  <thead className="bg-slate-50 dark:bg-slate-800/50 text-xs uppercase text-slate-700 dark:text-slate-300 sticky top-0 z-10 backdrop-blur-md">
                    <tr>
                      <th className="px-6 py-4 font-semibold">Date</th>
                      <th className="px-6 py-4 font-semibold">Habit</th>
                      <th className="px-6 py-4 font-semibold">Status</th>
                      <th className="px-6 py-4 font-semibold">Value</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-200 dark:divide-slate-800">
                    {sortedLogs.map(log => {
                      const h = habits.find(x => x.habit_id === log.habit_id);
                      if(!h) return null;
                      return (
                        <tr key={log.log_id} className="hover:bg-slate-50 dark:hover:bg-slate-800/30 transition-colors">
                          <td className="px-6 py-4 whitespace-nowrap">{log.date}</td>
                          <td className="px-6 py-4 font-medium text-slate-900 dark:text-slate-200">{h.habit_name}</td>
                          <td className="px-6 py-4">
                            <span className={classNames(
                              "px-2.5 py-1 rounded-full text-xs font-semibold",
                              log.status === 'done' ? "bg-emerald-100 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-400" :
                              log.status === 'partial' ? "bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-400" :
                              "bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400"
                            )}>
                              {String(log.status).toUpperCase()}
                            </span>
                          </td>
                          <td className="px-6 py-4">{log.value} {h.habit_type === 'count' ? 'times' : h.habit_type==='duration' ? 'mins' : ''}</td>
                        </tr>
                      )
                    })}
                    {sortedLogs.length === 0 && (
                      <tr><td colSpan="4" className="px-6 py-8 text-center text-slate-500">No logs recorded yet.</td></tr>
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          );
        }

        function SettingsView({ showToast, userGender, setUserGender, onRefresh }) {
          const [url, setUrl] = useState(localStorage.getItem('sheets_api_url') || '');
          const [notificationStatus, setNotificationStatus] = useState(
            'Notification' in window ? Notification.permission : 'unsupported'
          );
          
          const handleSave = async () => {
            localStorage.setItem('sheets_api_url', url);
            showToast('Backend Connection updated! Syncing data...', 'success');
            if (onRefresh) onRefresh(); 
          };

          const enableNotifications = async () => {
            if (!('Notification' in window)) {
              showToast('This browser does not support desktop notifications.', 'warning');
              return;
            }
            
            try {
              const permission = await Notification.requestPermission();
              setNotificationStatus(permission);
              if (permission === 'granted') {
                new Notification('SyncHabit', { body: 'Notifications enabled successfully!' });
                showToast('Notifications enabled successfully!', 'success');
              } else {
                showToast('Notification permission denied.', 'warning');
              }
            } catch (error) {
              console.error(error);
            }
          };

          return (
            <div className="animate-fade-in max-w-2xl space-y-6">
              
              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-sm">
                <h3 className="text-lg font-bold mb-4 flex items-center gap-2 text-blue-600 dark:text-blue-400">
                  <svg className="w-6 h-6" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19,3H5C3.89,3 3,3.9 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5C21,3.89 20.1,3 19,3M19,19H5V5H19V19M11,7H13V9H11V7M11,11H13V17H11V11Z" />
                  </svg>
                  Google Sheets Integration {url ? '🟢 (Connected)' : '🔴 (Offline Mode)'}
                </h3>
                <p className="text-sm text-slate-500 dark:text-slate-400 mb-6">
                  Connect your custom Google Apps Script Web App URL to sync all your habits, logs, and stats directly to your personal Google Sheet.
                </p>
                
                <div className="space-y-4">
                  <div>
                    <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Apps Script Web App URL</label>
                    <input 
                      type="text" 
                      value={url}
                      onChange={(e) => setUrl(e.target.value)}
                      className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none font-mono text-sm" 
                    />
                  </div>
                  <button onClick={handleSave} className="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-xl font-medium transition-colors">
                    Test Connection & Save
                  </button>
                </div>
              </div>

              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-sm space-y-4">
                <h3 className="text-lg font-bold">Preferences</h3>
                
                <div className="flex items-center justify-between py-3 border-b border-slate-100 dark:border-slate-800">
                  <div>
                    <div className="font-medium text-slate-900 dark:text-white">Profile Gender</div>
                    <div className="text-sm text-slate-500">Personalize your dashboard avatar.</div>
                  </div>
                  <select
                    value={userGender}
                    onChange={(e) => {
                      setUserGender(e.target.value);
                      showToast('Profile updated!', 'success');
                    }}
                    className="bg-slate-50 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2 outline-none text-sm font-medium"
                  >
                    <option value="man">Man</option>
                    <option value="woman">Woman</option>
                  </select>
                </div>

                <div className="flex items-center justify-between py-3">
                  <div>
                    <div className="font-medium text-slate-900 dark:text-white">Push Notifications (Desktop/Mobile)</div>
                    <div className="text-sm text-slate-500">
                      {notificationStatus === 'granted' ? 'System notifications are active.' : 'Receive alerts even when the browser is closed.'}
                    </div>
                  </div>
                  {notificationStatus === 'granted' ? (
                    <span className="px-3 py-1 bg-emerald-100 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-400 rounded-full text-xs font-bold">Active</span>
                  ) : (
                    <button 
                      onClick={enableNotifications}
                      className="bg-slate-900 hover:bg-slate-800 dark:bg-white dark:hover:bg-slate-200 text-white dark:text-slate-900 px-4 py-1.5 rounded-lg text-sm font-medium transition-colors"
                    >
                      Enable
                    </button>
                  )}
                </div>
              </div>
              
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

    </script>
</body>
</html>
